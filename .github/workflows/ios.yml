name: iOS Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build for simulator (unsigned)
        working-directory: CBTDiary
        run: |
          xcodebuild \
            -project CBTDiary.xcodeproj \
            -scheme CBTDiary \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate built .app
        id: app
        working-directory: CBTDiary
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -maxdepth 3 -type d | head -1)
          echo "Built: $APP_PATH"
          echo "path=CBTDiary/$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBTDiary-app-unsigned
          path: ${{ steps.app.outputs.path }}
          if-no-files-found: error
